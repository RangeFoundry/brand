version = 1

# Everything else: tokens.css, examples/, the docs and the dev container.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "MIT"

# Logo and icon artwork: no open license (LICENSES/LicenseRef-Brand.txt).
[[annotations]]
path = ["rangefoundry/**", "autolever/**", "buildguide/**", "workbench/**"]
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "LicenseRef-Brand"

# The logo generator embeds the logo geometry, so it is part of the artwork.
[[annotations]]
path = "generate.py"
SPDX-FileCopyrightText = "2026 the RangeFoundry contributors"
SPDX-License-Identifier = "LicenseRef-Brand"

# Albert Sans subsets and the license text they ship with (fonts/OFL.txt).
[[annotations]]
path = "fonts/**"
SPDX-FileCopyrightText = "2021 The Albert Sans Project Authors (https://github.com/usted/Albert-Sans)"
SPDX-License-Identifier = "OFL-1.1"
